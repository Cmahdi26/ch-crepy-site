name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix absolute links for project base path
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path

          def fix(html: str) -> str:
              routes = [
                  "maisons-de-retraite", "mentions-legales", "accessibilite",
                  "organisation", "actualites", "contact", "emplois", "qualite",
                  "login", "usld", "smr",
              ]
              for r in routes:
                  html = re.sub(
                      rf'href="/{re.escape(r)}(#[^"]*)?"',
                      lambda m, r=r: f'href="{r}.html{m.group(1) or ""}"',
                      html,
                  )
              html = re.sub(
                  r'href="/(#[^"]*)?"',
                  lambda m: f'href="index.html{m.group(1) or ""}"',
                  html,
              )
              return html

          for p in Path(".").rglob("*.html"):
              if "node_modules" in p.parts:
                  continue
              original = p.read_text(encoding="utf-8")
              fixed = fix(original)
              if fixed != original:
                  p.write_text(fixed, encoding="utf-8")
                  print("fixed", p)
              else:
                  print("ok", p)

          # remove decorative skeleton avatar circle in header
          for p in Path(".").rglob("*.html"):
              if "node_modules" in p.parts:
                  continue
              t = p.read_text(encoding="utf-8")
              nt = t.replace(
                  '<div class="h-9 w-9 animate-pulse rounded-full bg-[var(--color-bg-subtle)]" aria-hidden="true"></div>',
                  '',
              )
              if nt != t:
                  p.write_text(nt, encoding="utf-8")
                  print("removed skeleton", p)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
